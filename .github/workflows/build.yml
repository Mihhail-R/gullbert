name: Build Gullbert
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/release.mjs check
      - run: npm run check
      - run: npm run format:check
  desktop:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle: app,dmg
            artifact: mac-apple-silicon
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundle: app,dmg
            artifact: mac-intel
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Validate release version
        run: node scripts/release.mjs check
      - name: Build signed update packages and installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
      - name: Run native lifecycle tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --target ${{ matrix.target }}
      - name: Collect installers and update signatures
        run: node scripts/release.mjs collect ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: Gullbert-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: dist/*
  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: Gullbert-*
          path: artifacts
          merge-multiple: true
      - name: Assemble update manifest for all platforms
        run: node scripts/release.mjs merge artifacts
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/*.dmg
            artifacts/*.exe
            artifacts/*.tar.gz
            artifacts/*.sig
            artifacts/latest.json
          body: |
            Install on Mac: download the DMG for your processor, open it, and drag Gullbert into Applications. Quit any older copy first, then open Gullbert from Applications.
            Install on Windows: run the setup.exe.
            Future updates: open App updates in Gullbert and choose Check for updates, then Install and restart.
            Beta builds include beta releases by default; stable builds only offer stable releases unless you opt in.
            Mac builds are ad-hoc signed, not Apple-notarized. Windows installers are unsigned. Update packages are cryptographically signed.
            The .tar.gz and .sig files and latest.json are for the in-app updater.
            Read the README's platform notes before downloading. Please report your OS and version with any bug.
