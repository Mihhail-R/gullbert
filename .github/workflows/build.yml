name: Build Gullbert
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag to build or retry (leave empty for unsigned builds and tests)"
        required: false
        type: string
permissions:
  contents: read
env:
  # Upgrade deliberately so main and release tags use compatible Rust caches.
  RUST_TOOLCHAIN: "1.99.1"
  RELEASE_TAG: ${{ inputs.release_tag || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      # Keep the selected workflow's release tooling when retrying an older tag.
      - name: Preserve release tooling
        if: env.RELEASE_TAG != ''
        run: cp scripts/release.mjs "$RUNNER_TEMP/gullbert-release.mjs"
      - name: Check out the existing release tag
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag }}
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set embedded versions from the release tag
        if: env.RELEASE_TAG != ''
        run: |
          cp "$RUNNER_TEMP/gullbert-release.mjs" scripts/release.mjs
          node scripts/release.mjs prepare "$RELEASE_TAG"
      - run: node scripts/release.mjs check
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Check code readability
        if: hashFiles('eslint.config.mjs') != ''
        run: npm run lint
      - run: npm run format:check
      - name: Share validated release metadata
        if: env.RELEASE_TAG != ''
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          if-no-files-found: error
          retention-days: 14
          path: |
            scripts/release.mjs
            package.json
            package-lock.json
            src-tauri/Cargo.toml
            src-tauri/Cargo.lock
            src-tauri/tauri.conf.json
  desktop:
    # Main keeps caches available to future tags. Manual runs can validate the
    # native pipeline without publishing; pull requests retain frontend checks.
    if: github.event_name != 'pull_request'
    name: ${{ matrix.platform }} (${{ matrix.task }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        platform: [mac-apple-silicon, mac-intel, windows-x64]
        task: [package, test]
        include:
          - platform: mac-apple-silicon
            os: macos-latest
            target: aarch64-apple-darwin
            bundle: app,dmg
          - platform: mac-intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundle: app,dmg
          - platform: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.test.outputs.source_sha }}
      - uses: actions/download-artifact@v4
        if: env.RELEASE_TAG != ''
        with:
          name: release-metadata
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # Separate test and release profiles so parallel jobs never compete
          # to save incomplete caches under the same immutable key.
          shared-key: desktop-${{ matrix.target }}-${{ matrix.task }}
          # Tag caches cannot be restored by later tags. Only main writes them;
          # retries of old tags must not replace main's dependency cache either.
          save-if: ${{ github.ref == 'refs/heads/main' && env.RELEASE_TAG == '' }}
      - run: npm ci
      - name: Validate release version
        run: node scripts/release.mjs check
      - name: Build without installers to warm the release cache
        if: matrix.task == 'package' && env.RELEASE_TAG == ''
        run: npm run build -- --target ${{ matrix.target }} --no-bundle
      - name: Build signed update packages and installers
        if: matrix.task == 'package' && env.RELEASE_TAG != ''
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
      - name: Build frontend for native tests
        if: matrix.task == 'test'
        run: npm run build:web
      - name: Prepare Windows OCR models for native tests
        if: matrix.task == 'test' && runner.os == 'Windows'
        run: npm run prepare:vision
      - name: Run native lifecycle tests
        if: matrix.task == 'test'
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --target ${{ matrix.target }}
      - name: Verify routing through the application and simulation
        if: matrix.task == 'test'
        run: npm run test:routing -- --target ${{ matrix.target }}
      - name: Collect installers and update signatures
        if: matrix.task == 'package' && env.RELEASE_TAG != ''
        run: node scripts/release.mjs collect ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: matrix.task == 'package' && env.RELEASE_TAG != ''
        with:
          name: Gullbert-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: dist/*
  draft-release:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    # Every platform must finish both packaging and native tests successfully.
    needs: [test, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.test.outputs.source_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: release-metadata
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: Gullbert-*
          path: artifacts
          merge-multiple: true
      - name: Assemble update manifest for all platforms
        run: node scripts/release.mjs merge artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          generate_release_notes: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          files: |
            artifacts/*.dmg
            artifacts/*.exe
            artifacts/*.tar.gz
            artifacts/*.sig
            artifacts/latest.json
          body: |
            Install on Mac: download the DMG for your processor, open it, and drag Gullbert into Applications. Quit any older copy first, then open Gullbert from Applications.
            Install on Windows: run the setup.exe.
            Future updates: open App updates in Gullbert and choose Check for updates, then Install and restart.
            Beta builds include beta releases by default; stable builds only offer stable releases unless you opt in.
            Mac builds are ad-hoc signed, not Apple-notarized. Windows installers are unsigned. Update packages are cryptographically signed.
            The .tar.gz and .sig files and latest.json are for the in-app updater.
            Read the README's platform notes before downloading. Please report your OS and version with any bug.
