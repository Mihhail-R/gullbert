name: Build Gullbert
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run format:check
  desktop:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle: app
            artifact: mac-apple-silicon
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundle: app
            artifact: mac-intel
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
      - name: Run native lifecycle tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --target ${{ matrix.target }}
      - name: Zip Mac application preserving bundle metadata
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          codesign --force --deep --sign - src-tauri/target/${{ matrix.target }}/release/bundle/macos/Gullbert.app
          codesign --verify --deep --strict src-tauri/target/${{ matrix.target }}/release/bundle/macos/Gullbert.app
          ditto -c -k --sequesterRsrc --keepParent src-tauri/target/${{ matrix.target }}/release/bundle/macos/Gullbert.app dist/Gullbert-${{ matrix.artifact }}.zip
      - name: Collect Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe dist/
      - uses: actions/upload-artifact@v4
        with:
          name: Gullbert-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: dist/*
  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Gullbert-*
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*
          body: |
            An early Gullbert preview. These builds are unsigned and not notarized.
            Read the README's platform notes before downloading. Please report your OS and version with any bug.
