[package]
name = "gullbert"
version = "0.3.0-beta.3"
description = "A tiny desktop seagull"
authors = ["Gullbert contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2"
semver = "1"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }

[target.'cfg(target_os = "windows")'.dependencies]
# The event observer uses the runtime plugin API; keep it aligned with Tauri's locked runtime.
tauri-runtime-wry = { version = "=2.12.1", default-features = false }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt"] }
tracing = "0.1"

[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2.5.4"
